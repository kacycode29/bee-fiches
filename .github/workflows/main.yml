name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Normaliser le nom du générateur
        run: |
          cd app/src/main/assets
          if [ -f "index.html.html" ]; then
            mv -f "index.html.html" "index.html"
            echo "index.html.html renomme en index.html"
          elif [ -f "index" ]; then
            mv -f "index" "index.html"
            echo "index renomme en index.html"
          fi
          rm -f "index" "index.html.html"
          echo "Generateur retenu : $(stat -c%s index.html) octets"
          if [ "$(stat -c%s index.html)" -lt 1326000 ]; then
            echo "::warning::Le generateur semble etre une version anterieure a la 13.2."
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Restaurer la clé de signature
        env:
          CLE_BASE64: ${{ secrets.BEE_KEYSTORE_BASE64 }}
          MDP: ${{ secrets.BEE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$CLE_BASE64" ]; then
            echo "::error::Le secret BEE_KEYSTORE_BASE64 est vide ou absent."
            exit 1
          fi
          printf '%s' "$CLE_BASE64" | tr -d '[:space:]' | base64 -di > "$RUNNER_TEMP/bee-release.jks"
          TAILLE=$(stat -c%s "$RUNNER_TEMP/bee-release.jks")
          echo "Clé restaurée : $TAILLE octets (attendu : 4418)"
          if [ "$TAILLE" -lt 4000 ]; then
            echo "::error::Clé incomplète. Le contenu du secret BEE_KEYSTORE_BASE64 a été tronqué au copier-coller."
            exit 1
          fi
          if keytool -list -keystore "$RUNNER_TEMP/bee-release.jks" -storepass "$MDP" -storetype PKCS12 > /dev/null 2>&1; then
            echo "Clé lisible, mot de passe correct."
          else
            echo "::error::Clé illisible, ou mot de passe BEE_KEYSTORE_PASSWORD incorrect."
            exit 1
          fi

      - name: Compiler l'APK signée
        env:
          BEE_KEYSTORE_FILE: ${{ runner.temp }}/bee-release.jks
          BEE_KEYSTORE_PASSWORD: ${{ secrets.BEE_KEYSTORE_PASSWORD }}
          BEE_KEY_ALIAS: ${{ secrets.BEE_KEY_ALIAS }}
          BEE_KEY_PASSWORD: ${{ secrets.BEE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          keytool -printcert -jarfile "$APK" | grep -E "Owner|Propriétaire|SHA256" | head -4

      - name: Préparer le fichier
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/BEE-Fiches-v${{ github.run_number }}.apk"
          ls -lh out/

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/bee-release.jks"

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 90

      - name: Publier l'APK dans une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "APK v${{ github.run_number }}" \
            --notes "APK signée avec la clé permanente BEE. Installable et modifiable par mise à jour."
