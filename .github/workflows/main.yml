name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer le fichier
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/BEE-Fiches-v${{ github.run_number }}.apk"
          ls -lh out/

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 90

      - name: Publier l'APK dans une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "APK v${{ github.run_number }}" \
            --notes "APK généré automatiquement. Téléchargez le fichier .apk ci-dessous et installez-le sur Android."
