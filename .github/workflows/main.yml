name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Restaurer la clé de signature
        env:
          CLE_BASE64: ${{ secrets.BEE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLE_BASE64" ]; then
            echo "Le secret BEE_KEYSTORE_BASE64 est absent." && exit 1
          fi
          printf '%s' "$CLE_BASE64" | base64 -d > "$RUNNER_TEMP/bee-release.jks"
          echo "Clé restaurée : $(stat -c%s "$RUNNER_TEMP/bee-release.jks") octets"

      - name: Compiler l'APK signée
        env:
          BEE_KEYSTORE_FILE: ${{ runner.temp }}/bee-release.jks
          BEE_KEYSTORE_PASSWORD: ${{ secrets.BEE_KEYSTORE_PASSWORD }}
          BEE_KEY_ALIAS: ${{ secrets.BEE_KEY_ALIAS }}
          BEE_KEY_PASSWORD: ${{ secrets.BEE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          keytool -printcert -jarfile "$APK" | grep -E "Owner|Propriétaire|SHA256" | head -4

      - name: Préparer le fichier
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/BEE-Fiches-v${{ github.run_number }}.apk"
          ls -lh out/

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/bee-release.jks"

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 90

      - name: Publier l'APK dans une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "APK v${{ github.run_number }}" \
            --notes "APK signée avec la clé permanente BEE. Installable et modifiable par mise à jour."
