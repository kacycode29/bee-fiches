plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burkinaenglishexpress.lessonplan'
    compileSdk 34

    defaultConfig {
        applicationId "com.burkinaenglishexpress.lessonplan"
        minSdk 21
        targetSdk 34
        versionCode 17
        versionName "13.5"
    }

    // Clé de signature permanente. Elle est fournie par GitHub au moment de la
    // compilation ; aucun mot de passe n'est écrit dans ce fichier.
    signingConfigs {
        release {
            def fichierCle = System.getenv("BEE_KEYSTORE_FILE")
            if (fichierCle) {
                storeFile file(fichierCle)
                storePassword System.getenv("BEE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BEE_KEY_ALIAS")
                keyPassword System.getenv("BEE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("BEE_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
